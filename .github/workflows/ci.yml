name: Mission Control CI
run-name: "${{ github.event_name }} / ${{ inputs.configuration || 'Release' }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Konfiguracja .NET
        type: choice
        options: [Release, Debug]
        default: Release
      extra_diagnostics:
        description: Dodatkowe informacje o SDK i Dockerze
        type: boolean
        default: false

env:
  BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
  CACHE_NAMESPACE: lab02-v2

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Ustal zakres zmian
        id: detect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let backend = true, frontend = true, count = 0;
            if (context.eventName === 'pull_request') {
              const pull_number = context.payload.pull_request.number;
              const args = {...context.repo, pull_number};
              const {data: pr} = await github.rest.pulls.get(args);
              if (pr.head.sha !== context.payload.pull_request.head.sha ||
                  !Number.isInteger(pr.changed_files) || pr.changed_files < 0 || pr.changed_files > 3000) {
                throw new Error('Nieprawidlowy lub nieaktualny zakres PR');
              }
              const files = await github.paginate(github.rest.pulls.listFiles, {...args, per_page: 100});
              if (files.length !== pr.changed_files) throw new Error('Niekompletna lista plikow');
              backend = false; frontend = false; count = files.length;
              for (const file of files) {
                if (typeof file.filename !== 'string' || !file.filename ||
                    !['added','removed','modified','renamed','copied','changed','unchanged'].includes(file.status) ||
                    (file.status === 'renamed' && typeof file.previous_filename !== 'string')) {
                  throw new Error('Nieznany format pliku PR');
                }
                for (const path of [file.filename, file.previous_filename].filter(Boolean)) {
                  if (typeof path !== 'string') throw new Error('Nieprawidlowa sciezka');
                  if (path.startsWith('.github/')) { backend = true; frontend = true; }
                  else if (/^(backend\/|backend\.tests\/|MissionControl\.slnx$|global\.json$|Directory\.Build\.[^/]+$|NuGet\.Config$)/i.test(path)) backend = true;
                  else if (/^(frontend\/|\.nvmrc$)/.test(path)) frontend = true;
                  else if (/^(docs\/|thesis\/|README(?:\.[^/]+)?$|LICENSE(?:\.[^/]+)?$)/i.test(path)) { /* dokumentacja */ }
                  else { backend = true; frontend = true; }
                }
              }
              const {data: latest} = await github.rest.pulls.get(args);
              if (latest.head.sha !== pr.head.sha || latest.changed_files !== count) throw new Error('PR zmienil sie podczas detekcji');
            }
            core.setOutput('backend', String(backend));
            core.setOutput('frontend', String(frontend));
            core.setOutput('count', String(count));
            core.info(`Pliki: ${count}; backend=${backend}; frontend=${frontend}`);

  comment:
    name: PR summary
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Zaktualizuj podsumowanie PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BACKEND: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          COUNT: ${{ needs.changes.outputs.count }}
        with:
          script: |
            const {BACKEND, FRONTEND, COUNT} = process.env;
            if (![BACKEND, FRONTEND].every(v => ['true','false'].includes(v)) || !/^\d+$/.test(COUNT)) throw new Error('Bledne metadane');
            const marker = '<!-- mission-control-ci-summary -->';
            const body = `${marker}\nPliki: ${COUNT}. Backend: ${BACKEND}; frontend: ${FRONTEND}.`;
            const args = {...context.repo, issue_number: context.payload.pull_request.number};
            const comments = await github.paginate(github.rest.issues.listComments, {...args, per_page: 100});
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && typeof c.body === 'string' && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({...args, body});

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/backend.yml
    with:
      configuration: ${{ inputs.configuration || 'Release' }}
      publish_reports: true
      report_retention_days: 7
      extra_diagnostics: ${{ inputs.extra_diagnostics || false }}

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    outputs:
      report_name: ${{ steps.metadata.outputs.report_name }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Pobierz kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Jawna etykieta projektu
        env:
          LAB_LABEL: ${{ vars.LAB_LABEL }}
        run: |
          printf 'Projekt: %s\n' "$LAB_LABEL"
      - name: Sprawdz tylko obecnosc sekretu cwiczeniowego
        env:
          LAB_DEMO_TOKEN: ${{ secrets.LAB_DEMO_TOKEN }}
        run: |
          if [ -n "$LAB_DEMO_TOKEN" ]; then
            printf 'Sekret cwiczeniowy skonfigurowany\n'
          else
            printf 'Brak sekretu; testy nie wymagaja go do pracy\n'
          fi
      - name: Sprawdz trzy lockfiles i wersje Node
        run: |
          test -f backend/packages.lock.json
          test -f backend.tests/packages.lock.json
          test -f frontend/package-lock.json
          test -f .nvmrc
      - name: Metadane raportu
        id: metadata
        run: |
          printf 'report_name=frontend-tests-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo 'REPORT_COMPONENT=frontend' >> "$GITHUB_ENV"
      - name: Odczytaj metadane w kolejnym kroku
        env:
          REPORT_NAME: ${{ steps.metadata.outputs.report_name }}
        run: printf '%s / %s\n' "$REPORT_COMPONENT" "$REPORT_NAME"
      - name: Przygotuj Node z .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Wersja runtime do klucza
        id: runtime
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
      - name: Cache npm
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ env.CACHE_NAMESPACE }}-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.runtime.outputs.version }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Wynik cache npm
        env:
          EXACT_HIT: ${{ steps.cache.outputs.cache-hit == 'true' }}
        run: printf 'Exact cache hit = %s\n' "$EXACT_HIT"
      - name: Zainstaluj zaleznosci frontendu
        working-directory: frontend
        run: npm ci
      - name: Build frontendu
        working-directory: frontend
        run: npm run build
      - name: Testy UI bez API
        working-directory: frontend
        run: npm test
      - name: Sprawdz raporty po udanych testach UI
        run: |
          test -s frontend/test-results/junit.xml
          test -s frontend/test-results/results.json
      - name: Zachowaj raporty frontendu
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.report_name }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: warn

  summary:
    name: Reports summary
    needs: [changes, backend, frontend]
    if: ${{ always() && needs.changes.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Sprawdz nowy workspace
        env:
          BACKEND_REPORT: ${{ needs.backend.outputs.report_name }}
          FRONTEND_REPORT: ${{ needs.frontend.outputs.report_name }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          printf 'Raporty: %s / %s\n' "$BACKEND_REPORT" "$FRONTEND_REPORT"
          test ! -e TestResults/backend.trx
          test ! -e frontend/test-results/results.json
          if [ "$BACKEND_RESULT" = success ]; then test -n "$BACKEND_REPORT"; fi
          if [ "$FRONTEND_RESULT" = success ]; then test -n "$FRONTEND_REPORT"; fi
          find . -maxdepth 2 -type f
          mkdir -p received
      - name: Pobierz raport backendu
        if: ${{ needs.backend.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.backend.outputs.report_name }}
          path: received/backend
      - name: Pobierz raport frontendu
        if: ${{ needs.frontend.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.frontend.outputs.report_name }}
          path: received/frontend
      - name: Sprawdz odebrane pliki
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$BACKEND_RESULT" = success ]; then test -s received/backend/backend.trx; fi
          if [ "$FRONTEND_RESULT" = success ]; then
            test -s received/frontend/junit.xml
            test -s received/frontend/results.json
          fi
          find received -type f

  gate:
    name: ci-required
    needs: [changes, backend, frontend]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Sprawdz wyniki wymaganych komponentow
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        shell: bash
        run: |
          if [ "$CHANGES_RESULT" != success ]; then
            echo '::error::Detekcja zmian nie zakonczyla sie sukcesem'
            exit 1
          fi
          check_component() {
            local component="$1" required="$2" result="$3"
            case "$required:$result" in
              true:success|false:skipped) printf '%s: required=%s, result=%s\n' "$component" "$required" "$result" ;;
              *) printf '::error::%s: niezgodne required=%s, result=%s\n' "$component" "$required" "$result"; return 1 ;;
            esac
          }
          check_component backend "$BACKEND_REQUIRED" "$BACKEND_RESULT"
          check_component frontend "$FRONTEND_REQUIRED" "$FRONTEND_RESULT"

  metadata:
    name: CI metadata
    needs: gate
    if: ${{ always() && needs.gate.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Zapisz metadane producenta
        env:
          SOURCE_SHA: ${{ github.sha }}
          PRODUCER_ID: ${{ github.run_id }}
          PRODUCER_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os
          data = dict(schema_version=1, source_sha=os.environ['SOURCE_SHA'],
                      run_id=os.environ['PRODUCER_ID'], run_attempt=int(os.environ['PRODUCER_ATTEMPT']))
          with open('ci-metadata.json', 'w', encoding='utf-8') as stream:
              json.dump(data, stream)
          PY
      - name: Zachowaj metadane
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-metadata.json
          retention-days: 7
          if-no-files-found: error
